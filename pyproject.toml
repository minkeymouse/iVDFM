[project]
name = "ivdfm"
version = "1.0.0"
description = "Experiments for the Identifiable Variational Dynamic Factor Model (iVDFM)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Minkey Chang" }]
requires-python = ">=3.10"
dependencies = [
    # The iVDFM model itself (and the DFM / DDFM baselines) live in dfm-python.
    "dfm-python>=0.7.0",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "numpy>=1.24,<2.4",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "pytorch-lightning>=2.0.0",
    "optuna>=3.0.0",
    "matplotlib>=3.5.0",
    "pyyaml>=6.0",
    # Forecasting baselines (iTransformer, TimeMixer, TimeXer, MLPMultivariate).
    "neuralforecast>=3.1.4",
]

[project.urls]
Repository = "https://github.com/minkeymouse/iVDFM"
Paper = "https://proceedings.mlr.press/v327/chang26a.html"

[dependency-groups]
dev = [
    "ruff>=0.5",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["results"]

[tool.ruff.lint]
# Keep the public release lint-clean on real errors without reformatting research code.
select = ["E9", "F63", "F7", "F82", "F401"]
