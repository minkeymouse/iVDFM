# Application (Section 5): fit iVDFM to a real multivariate panel and report factor loadings.
# Default: daily exchange rates around the 2008 crisis. For the influenza-like-illness panel use
#   experiment.name=illness experiment.data_path=./data/illness/national_illness.csv
#   'experiment.series_cols=[WEIGHTED_ILI_PCT,UNWEIGHTED_ILI_PCT,OT]' experiment.start_time=null experiment.end_time=null
#   experiment.crisis_start_time=null experiment.crisis_end_time=null experiment.window=418

# --- Data ---
data_path: ./data/exchange/exchange_rate.csv
time_col: date
series_cols: [AUD_USD, JPY_USD, CAD_USD, CNY_USD, NZD_USD]
n_rows: null            # truncate to the first n rows; ignored when a date range is set
start_time: 2007-10-01  # optional date range
end_time: 2009-03-31
crisis_start_time: 2008-09-15  # optional interval highlighted in the plots
crisis_end_time: 2009-03-31

# --- Model / fit ---
model: ivdfm
r: 2
window: 548   # number of rows in the selected date range (one full-length window)
stride: 1
max_epochs: 80
batch_size: 128

# --- Output ---
output_dir: ./results/application
name: exchange
